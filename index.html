<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统分析师 · 学习看板</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="系分看板">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --text:#1f2937; --muted:#6b7280;
    --brand:#2563eb; --brand-soft:#dbeafe; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    font-size:14px;line-height:1.5}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px 10px;position:sticky;top:0;z-index:10}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.3px}
  h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
  .kpis{display:flex;gap:18px;flex-wrap:wrap}
  .kpi{min-width:96px}
  .kpi .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
  .kpi .l{font-size:11px;color:var(--muted)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--text);
    padding:5px 10px;border-radius:7px;cursor:pointer}
  button:hover{border-color:#cbd5e1;background:#fafafa}
  nav{display:flex;gap:6px;margin-top:10px}
  nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px}
  nav button.on{background:var(--brand-soft);color:var(--brand);border-color:#bfdbfe;font-weight:600}
  main{padding:18px 20px 60px;max-width:1180px;margin:0 auto}
  section{display:none}
  section.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .mod-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .mod-h .t{font-weight:650}
  .mod-h .n{color:var(--muted);font-size:12px}
  .bar{height:8px;background:#eef1f5;border-radius:99px;overflow:hidden;margin:10px 0 8px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);width:0;border-radius:99px;transition:width .25s}
  .bar.mini{height:6px;margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{font-size:11px;padding:2px 7px;border-radius:99px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
  .chip.done{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
  .muted{color:var(--muted)}
  .banner{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 12px;border-radius:8px;
    font-size:12.5px;margin-bottom:14px}
  .week{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:12px 14px;margin-bottom:12px}
  .week.past{opacity:.88}
  .whead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .whead .w{font-weight:650;min-width:46px}
  .whead .d{color:var(--muted);font-size:12px;min-width:96px}
  .whead .s{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin-top:10px}
  .v{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;
    cursor:pointer;background:#fff;font-size:12px}
  .v:hover{background:#fafafa}
  .v.on{background:#f0fdf4;border-color:#a7f3d0}
  .v .box{width:13px;height:13px;border:1.5px solid #cbd5e1;border-radius:4px;flex:0 0 auto;position:relative}
  .v.on .box{background:var(--ok);border-color:var(--ok)}
  .v.on .box::after{content:"";position:absolute;left:3.5px;top:1px;width:4px;height:7px;
    border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
  .v .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v .mm{color:var(--muted);font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  th{background:#f8fafc;font-weight:600;color:#334155;font-size:12px;letter-spacing:.3px}
  tr:last-child td{border-bottom:0}
  tr.ch:hover td{background:#fafcff}
  .cb{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:12px}
  .cb .b{width:15px;height:15px;border:1.5px solid #cbd5e1;border-radius:4px;position:relative;background:#fff}
  .cb.on .b{background:var(--brand);border-color:var(--brand)}
  .cb.on .b::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
    border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
  .tag{font-size:11px;padding:1px 6px;border-radius:99px;background:#f1f5f9;color:#64748b}
  .tag.p1{background:#eff6ff;color:#1d4ed8}
  .tag.p2{background:#fef2f2;color:#b91c1c}
  .pct{font-variant-numeric:tabular-nums;font-weight:600}
  footer{padding:10px 20px 30px;text-align:center;color:#9ca3af;font-size:11.5px}
  .toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:8px 14px;border-radius:8px;
    font-size:12.5px;opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:none}
  @media (max-width:640px){
    .kpi{min-width:72px}.kpi .v{font-size:16px}
    th,td{padding:6px 7px;font-size:12px}
    .hide-sm{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>系统分析师 · 学习看板<small id="phaseTag">阶段 1（11.02—12.20）</small></h1>
    <div class="kpis">
      <div class="kpi"><div class="v" id="k1">—</div><div class="l">教材章节总进度</div></div>
      <div class="kpi"><div class="v" id="k2">—</div><div class="l">阶段 1 视频</div></div>
      <div class="kpi"><div class="v" id="k3">—</div><div class="l">距考试</div></div>
    </div>
    <div class="actions">
      <button id="btnExport">导出</button>
      <button id="btnImport">导入</button>
      <button id="btnReset">重置</button>
      <input type="file" id="file" accept=".json" style="display:none">
    </div>
  </div>
  <nav>
    <button data-view="modules" class="on">模块（5）</button>
    <button data-view="videos">视频（阶段 1）</button>
    <button data-view="chapters">教材章节（22）</button>
  </nav>
</header>

<main>
  <div id="banner" class="banner" hidden></div>

  <section id="view-modules" class="on">
    <div id="modGrid" class="grid"></div>
  </section>

  <section id="view-videos">
    <div id="vSummary" class="card" style="margin-bottom:14px"></div>
    <div id="weekList"></div>
  </section>

  <section id="view-chapters">
    <div class="card" style="padding:0;overflow:auto">
      <table>
        <thead>
          <tr>
            <th style="width:52px">章</th>
            <th>名称</th>
            <th style="width:78px" class="hide-sm">模块</th>
            <th style="width:86px" class="hide-sm">视频</th>
            <th style="width:56px">学</th>
            <th style="width:56px">图</th>
            <th style="width:56px">题</th>
            <th style="width:110px">进度</th>
          </tr>
        </thead>
        <tbody id="chBody"></tbody>
      </table>
    </div>
    <p class="muted" style="font-size:12px;margin:10px 2px">
      「学」= 视频或图文学习；「图」= 梳理导图；「题」= 章节刷题（≥70% 正确率）。三项全勾即本章完成。
    </p>
  </section>
</main>

<footer>数据存于本浏览器；换设备请先「导出」，在新设备「导入」。</footer>

const KEY = "fx_dashboard_v1";
const $ = (s, r = document) => r.querySelector(s);
const nowDate = () => (typeof window !== "undefined" && window.__NOW__) ? new Date(window.__NOW__) : new Date();
const el = (t, cls, html) => { const n = document.createElement(t); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
const fmtH = m => m ? (m / 60).toFixed(1).replace(/\.0$/, "") + "h" : "0h";
const mmss = m => { const t = Math.round(m * 60); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };

let state = { v: {}, c: {}, ts: new Date().toISOString() };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const p = JSON.parse(raw); if (p && p.v && p.c) state = p; }
  } catch (e) { toast("读取本地数据失败，已用空进度"); }
}
function save() {
  state.ts = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast("无法保存（浏览器限制），请用「导出」备份"); }
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 1800);
}

const chapById = Object.fromEntries(DATA.chapters.map(c => [c.id, c]));
const modById = Object.fromEntries(DATA.modules.map(m => [m.id, m]));
const videosOf = ch => DATA.videos.filter(v => v.ch === ch);

function chapProg(ch) {
  const s = state.c[ch.id] || {};
  return (Number(!!s.s) + Number(!!s.g) + Number(!!s.q)) / 3;
}
function modProg(m) {
  const list = DATA.chapters.filter(c => c.module === m.id);
  if (!list.length) return { p: 0, n: 0, done: 0 };
  const p = list.reduce((a, c) => a + chapProg(c), 0) / list.length;
  const main = list.filter(c => !c.extra);
  const done = main.filter(c => chapProg(c) === 1).length;
  return { p, n: main.length, done };
}
function videoProg() {
  const total = DATA.videos.length, done = DATA.videos.filter(v => state.v[v.id]).length;
  const mins = DATA.videos.reduce((a, v) => a + v.min, 0);
  const doneMin = DATA.videos.filter(v => state.v[v.id]).reduce((a, v) => a + v.min, 0);
  return { total, done, mins, doneMin };
}

/* ---------- KPI ---------- */
function renderKpi() {
  const cs = DATA.chapters.filter(c => !c.extra);
  const all = cs.length;
  const done = cs.filter(c => chapProg(c) === 1).length;
  const overall = cs.reduce((a, c) => a + chapProg(c), 0) / all;
  $("#k1").textContent = Math.round(overall * 100) + "%";
  $("#k1").title = `已完成 ${done}/${all} 章`;

  const v = videoProg();
  $("#k2").textContent = v.done + "/" + v.total;

  const exam = new Date(DATA.examDate + "T00:00:00");
  const now = nowDate();
  const days = Math.ceil((exam - now) / 86400000);
  $("#k3").textContent = days > 0 ? days + " 天" : "已开考";
  $("#k3").title = "考试日期（预计）：" + DATA.examDate;

  const p1End = new Date(DATA.phase1.end + "T23:59:59");
  const over = now > p1End;
  $("#phaseTag").textContent = over ? "阶段 1 已结束（视频视图转为归档）" : "阶段 1（11.02—12.20）";
  const b = $("#banner");
  if (over) {
    b.hidden = false;
    b.textContent = "阶段 1 已结束：视频视图仅供归档查看；后续进度请在「教材章节」维护。";
  } else { b.hidden = true; }
}

/* ---------- 模块 ---------- */
function renderModules() {
  const box = $("#modGrid"); box.innerHTML = "";
  for (const m of DATA.modules) {
    const list = DATA.chapters.filter(c => c.module === m.id);
    const pr = modProg(m);
    const vids = list.reduce((a, c) => a + c.videos, 0);
    const mins = list.reduce((a, c) => a + c.vmin, 0);

    const card = el("div", "card");
    card.innerHTML = `
      <div class="mod-h">
        <div><span class="t">模块 ${m.id} · ${m.name}</span></div>
        <div class="n">${pr.done}/${pr.n} 章</div>
      </div>
      <div class="muted" style="font-size:12px;margin-top:2px">${m.desc}</div>
      <div class="bar"><i style="width:${Math.round(pr.p * 100)}%"></i></div>
      <div style="display:flex;justify-content:space-between;font-size:12px">
        <span class="pct">${Math.round(pr.p * 100)}%</span>
        <span class="muted">${vids} 个视频 · ${fmtH(mins)}</span>
      </div>
      <div class="chips"></div>`;
    const chips = card.querySelector(".chips");
    for (const c of list) {
      const p = chapProg(c);
      const label = (c.extra ? "" : "ch" + c.no + " ") + c.short;
      const ch = el("span", "chip" + (p === 1 ? " done" : ""), label);
      ch.title = c.name + " · " + Math.round(p * 100) + "%";
      chips.appendChild(ch);
    }
    box.appendChild(card);
  }
}

function renderVideos() {

  s.innerHTML = `
    <div class="mod-h">
      <div class="t">阶段 1 视频总进度</div>

    <div class="muted" style="font-size:12px">

    </div>`;

  const wrap = $("#weekList"); wrap.innerHTML = "";
  const now = nowDate();

  for (const w of DATA.weeks) {

    const wMin = vids.reduce((a, x) => a + x.min, 0);

    box.appendChild(head);

    if (vids.length) {
      const bar = el("div", "bar mini");
      bar.innerHTML = `<i style="width:${pct(wDone.length, vids.length)}%"></i>`;
      box.appendChild(bar);
      const g = el("div", "vgrid");
      for (const x of vids) {
        const d = el("div", "v" + (state.v[x.id] ? " on" : ""));
        d.innerHTML = `<span class="box"></span><span class="tt" title="${x.title}">${x.title}</span><span class="mm">${mmss(x.min)}</span>`;
        d.onclick = () => { state.v[x.id] ? delete state.v[x.id] : state.v[x.id] = 1; save(); renderAll(); };
        g.appendChild(d);
      }
      box.appendChild(g);
    }

    if (tasks.length) {
      for (const t of tasks) {
        const c = chapById[t.ch];
        const on = !!(state.c[t.ch] && state.c[t.ch].s);
        const row = el("div", "v" + (on ? " on" : ""));
        row.style.marginTop = "8px";
        row.innerHTML = `<span class="box"></span><span class="tt">补 ${t.ch} ${c ? c.name : ""} · ${t.hours}h</span><span class="mm">图文/教材</span>`;
        row.onclick = () => { setChap(t.ch, "s", !on); };
        box.appendChild(row);
      }
    }
    wrap.appendChild(box);
  }
}

/* ---------- 章节 ---------- */
function setChap(id, k, val) {
  state.c[id] = state.c[id] || {};
  if (val) state.c[id][k] = 1; else delete state.c[id][k];
  save(); renderAll();
}
function renderChapters() {
  const body = $("#chBody"); body.innerHTML = "";
  for (const c of DATA.chapters.filter(x => !x.extra)) {
    const s = state.c[c.id] || {};
    const p = chapProg(c);
    const tr = el("tr", "ch");
    tr.innerHTML = `
      <td class="muted">${c.no}</td>
      <td>${c.name} ${c.stage === "late" ? '<span class="tag p2">阶段 2 后</span>' : ""}</td>
      <td class="hide-sm"><span class="tag">M${c.module}</span></td>
      <td class="hide-sm muted">${c.videos ? c.videos + " 个 · " + fmtH(c.vmin) : "—"}</td>
      <td><span class="cb ${s.s ? "on" : ""}" data-k="s"><span class="b"></span>学</span></td>
      <td><span class="cb ${s.g ? "on" : ""}" data-k="g"><span class="b"></span>图</span></td>
      <td><span class="cb ${s.q ? "on" : ""}" data-k="q"><span class="b"></span>题</span></td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="bar mini" style="flex:1"><i style="width:${Math.round(p * 100)}%"></i></div>
          <span class="pct" style="font-size:12px">${Math.round(p * 100)}%</span>
        </div>
      </td>`;
    tr.querySelectorAll(".cb").forEach(cb => {
      cb.onclick = () => { const k = cb.dataset.k; const cur = !!s[k]; setChap(c.id, k, !cur); };
    });
    body.appendChild(tr);
  }
}

/* ---------- 主渲染 ---------- */
function renderAll() { renderKpi(); renderModules(); renderVideos(); renderChapters(); }

/* ---------- 交互 ---------- */
function showView(name) {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x.dataset.view === name));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === "view-" + name));
}
document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => { showView(b.dataset.view); history.replaceState(null, "", "#" + b.dataset.view); };
});
$("#btnExport").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "看板进度-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("已导出");
};
$("#btnImport").onclick = () => $("#file").click();
$("#file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const p = JSON.parse(r.result);
      if (!p || typeof p !== "object" || !p.c) throw new Error("格式不对");
      state = { v: p.v || {}, c: p.c || {}, ts: p.ts };
      save(); renderAll(); toast("已导入");
    } catch (err) { toast("导入失败：不是有效的看板文件"); }
  };
  r.readAsText(f); e.target.value = "";
};
$("#btnReset").onclick = () => {
  if (!confirm("确认清空所有进度？此操作不可撤销（建议先导出）。")) return;
  state = { v: {}, c: {}, ts: new Date().toISOString() };
  save(); renderAll(); toast("已重置");
};

/* ---------- 启动 ---------- */
load();
renderAll();
(function initView() {
  const h = (location.hash || "").replace("#", "");
  if (["modules", "videos", "chapters"].includes(h)) showView(h);
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
